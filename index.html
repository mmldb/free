<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05070d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Free Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Freelance Tracker</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
        :root {
            color-scheme: dark;
            --bg: #05070d;
            --panel: #0d111b;
            --panel-soft: #121827;
            --text: #f8fafc;
            --muted: #8b96aa;
            --line: #202838;
            --accent: #60a5fa;
            --accent-strong: #2563eb;
            --accent-soft: rgba(96, 165, 250, 0.18);
            --good: #22c55e;
            --good-soft: rgba(34, 197, 94, 0.16);
            --danger: #fb7185;
            --danger-soft: rgba(251, 113, 133, 0.15);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 32rem),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: max(28px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 44px);
            letter-spacing: 0;
            line-height: 1;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
        }

        .year-pill {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 16px;
            align-items: start;
        }

        .panel,
        .metric {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .section {
            padding: 18px;
        }

        .section + .section {
            border-top: 1px solid var(--line);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric {
            padding: 16px;
        }

        .metric.received {
            background: linear-gradient(145deg, rgba(34, 197, 94, 0.18), var(--panel));
            border-color: rgba(34, 197, 94, 0.34);
        }

        .metric.open {
            background: linear-gradient(145deg, rgba(251, 113, 133, 0.13), var(--panel));
            border-color: rgba(251, 113, 133, 0.26);
        }

        .metric span,
        label,
        th {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .metric strong {
            display: block;
            margin-top: 8px;
            font-size: clamp(20px, 2.6vw, 32px);
            line-height: 1.05;
        }

        .progress-wrap {
            height: 18px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel-soft);
        }

        .progress {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent-strong), var(--good));
            transition: width 180ms ease;
        }

        .chart {
            position: relative;
            height: 260px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding-top: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--line);
        }

        .target-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            border-top: 1px dashed rgba(248, 250, 252, 0.34);
            pointer-events: none;
            z-index: 2;
        }

        .target-line span {
            position: absolute;
            right: 0;
            bottom: 6px;
            color: rgba(248, 250, 252, 0.58);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .bar-col {
            min-width: 0;
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: stretch;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .bar {
            min-height: 3px;
            border-radius: 6px 6px 0 0;
            background: linear-gradient(180deg, var(--accent), var(--accent-strong));
            position: relative;
        }

        .bar.empty {
            background: #1b2332;
        }

        .bar-value {
            position: absolute;
            left: 50%;
            top: -24px;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .bar-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .target-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            background: #090d15;
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .money-input {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #090d15;
            overflow: hidden;
        }

        .money-input:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .money-input input {
            min-height: 42px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
        }

        .money-input input:focus {
            border: 0;
            box-shadow: none;
        }

        .money-input span {
            padding: 0 12px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-soft);
            color: var(--text);
            font-weight: 800;
            text-transform: none;
        }

        .checkbox-row input {
            width: 18px;
            min-height: 18px;
            accent-color: var(--good);
        }

        .btn {
            min-height: 44px;
            border: 0;
            border-radius: 8px;
            padding: 0 16px;
            background: var(--accent-strong);
            color: #fff;
            font-weight: 800;
        }

        .btn.secondary {
            background: #1f2937;
        }

        .btn.danger {
            min-height: 34px;
            padding: 0 10px;
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(251, 113, 133, 0.36);
        }

        .paid-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0 10px;
            background: var(--panel-soft);
            color: var(--muted);
            font-weight: 800;
        }

        .paid-toggle.is-paid {
            border-color: rgba(34, 197, 94, 0.4);
            background: var(--good-soft);
            color: var(--good);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: currentColor;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: middle;
        }

        td:last-child,
        th:last-child {
            text-align: right;
        }

        .amount {
            font-weight: 800;
        }

        .paid-row .amount {
            color: var(--good);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty-state {
            padding: 22px 0 8px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 980px) {
            .metrics {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 820px) {
            .app {
                width: min(100% - 20px, 640px);
                padding: 18px 0;
            }

            header,
            .target-row {
                align-items: stretch;
                flex-direction: column;
            }

            .grid,
            .form-grid,
            .target-row {
                grid-template-columns: 1fr;
            }

            .chart {
                height: 220px;
                gap: 5px;
            }

            .bar-value,
            .target-line span {
                display: none;
            }

            th:nth-child(2),
            td:nth-child(2) {
                display: none;
            }
        }

        @media (max-width: 520px) {
            .metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div>
                <h1>Freelance Tracker</h1>
                <p class="subtitle">Szamlak, eves cel, beerkezett penz. Ennyi.</p>
            </div>
            <div class="year-pill" id="yearLabel"></div>
        </header>

        <section class="metrics" aria-label="Osszesites">
            <div class="metric">
                <span>Osszes szamla</span>
                <strong id="billedIncome">0 Ft</strong>
            </div>
            <div class="metric received">
                <span>Beerkezett</span>
                <strong id="receivedIncome">0 Ft</strong>
            </div>
            <div class="metric open">
                <span>Kint van</span>
                <strong id="openIncome">0 Ft</strong>
            </div>
            <div class="metric">
                <span>Eves cel</span>
                <strong id="targetValue">0 Ft</strong>
            </div>
            <div class="metric">
                <span>Haladas</span>
                <strong id="progressValue">0%</strong>
            </div>
        </section>

        <div class="grid">
            <section class="panel">
                <div class="section">
                    <div class="progress-wrap" aria-label="Eves cel haladas">
                        <div class="progress" id="progressBar"></div>
                    </div>
                </div>
                <div class="section">
                    <div class="chart" id="chart" aria-label="Havi beerkezett bevetel grafikon"></div>
                </div>
            </section>

            <aside class="panel">
                <form class="section target-row" id="targetForm">
                    <div class="field">
                        <label for="targetInput">Eves target</label>
                        <input id="targetInput" type="number" min="0" step="10000" inputmode="numeric">
                    </div>
                    <button class="btn secondary" type="submit">Mentes</button>
                </form>

                <form class="section form-grid" id="invoiceForm">
                    <div class="field">
                        <label for="invoiceDate">Datum</label>
                        <input id="invoiceDate" type="date" required>
                    </div>
                    <div class="field">
                        <label for="invoiceAmount">Osszeg</label>
                        <div class="money-input">
                            <input id="invoiceAmount" type="text" inputmode="numeric" autocomplete="off" placeholder="0" required>
                            <span>Ft</span>
                        </div>
                    </div>
                    <div class="field full">
                        <label for="invoiceName">Megjegyzes</label>
                        <input id="invoiceName" type="text" placeholder="pl. januari szamla">
                    </div>
                    <label class="checkbox-row field full" for="invoicePaid">
                        <input id="invoicePaid" type="checkbox">
                        Penz beerkezett
                    </label>
                    <button class="btn" type="submit">Szamla hozzaadasa</button>
                </form>
            </aside>
        </div>

        <section class="panel section" style="margin-top: 16px;">
            <table>
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Megjegyzes</th>
                        <th>Statusz</th>
                        <th>Osszeg</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="invoiceList"></tbody>
            </table>
            <div class="empty-state" id="emptyState">Meg nincs felvitt szamla.</div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = "freelance_tracker_data";
        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "Maj", "Jun", "Jul", "Aug", "Szep", "Okt", "Nov", "Dec"];
        const currentYear = new Date().getFullYear();
        const defaultState = {
            target: 12000000,
            invoices: []
        };

        let state = loadState();

        const elements = {
            yearLabel: document.getElementById("yearLabel"),
            billedIncome: document.getElementById("billedIncome"),
            receivedIncome: document.getElementById("receivedIncome"),
            openIncome: document.getElementById("openIncome"),
            targetValue: document.getElementById("targetValue"),
            progressValue: document.getElementById("progressValue"),
            progressBar: document.getElementById("progressBar"),
            chart: document.getElementById("chart"),
            targetForm: document.getElementById("targetForm"),
            targetInput: document.getElementById("targetInput"),
            invoiceForm: document.getElementById("invoiceForm"),
            invoiceDate: document.getElementById("invoiceDate"),
            invoiceAmount: document.getElementById("invoiceAmount"),
            invoiceName: document.getElementById("invoiceName"),
            invoicePaid: document.getElementById("invoicePaid"),
            invoiceList: document.getElementById("invoiceList"),
            emptyState: document.getElementById("emptyState")
        };

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return {
                    ...defaultState,
                    ...saved,
                    invoices: Array.isArray(saved?.invoices) ? saved.invoices : []
                };
            } catch {
                return { ...defaultState };
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function formatFt(value) {
            return new Intl.NumberFormat("hu-HU", {
                style: "currency",
                currency: "HUF",
                maximumFractionDigits: 0
            }).format(value);
        }

        function getYearInvoices() {
            return state.invoices
                .filter((invoice) => new Date(invoice.date).getFullYear() === currentYear)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function render() {
            const invoices = getYearInvoices();
            const billed = invoices.reduce((sum, invoice) => sum + invoice.amount, 0);
            const received = invoices
                .filter((invoice) => invoice.paid)
                .reduce((sum, invoice) => sum + invoice.amount, 0);
            const open = billed - received;
            const target = Number(state.target) || 0;
            const progress = target > 0 ? Math.min((received / target) * 100, 999) : 0;

            elements.yearLabel.textContent = currentYear;
            elements.billedIncome.textContent = formatFt(billed);
            elements.receivedIncome.textContent = formatFt(received);
            elements.openIncome.textContent = formatFt(open);
            elements.targetValue.textContent = formatFt(target);
            elements.progressValue.textContent = `${Math.round(progress)}%`;
            elements.progressBar.style.width = `${Math.min(progress, 100)}%`;
            elements.targetInput.value = target;

            renderChart(invoices, target);
            renderInvoices(invoices);
        }

        function renderChart(invoices, target) {
            const monthlyTarget = target > 0 ? target / 12 : 0;
            const monthly = Array.from({ length: 12 }, (_, month) => {
                return invoices
                    .filter((invoice) => invoice.paid)
                    .filter((invoice) => new Date(invoice.date).getMonth() === month)
                    .reduce((sum, invoice) => sum + invoice.amount, 0);
            });
            const plotHeight = Math.max(elements.chart.clientHeight - 56, 1);
            const maxValue = Math.max(monthlyTarget, ...monthly, 1);
            const targetTop = 28 + (1 - (monthlyTarget / maxValue)) * plotHeight;
            const targetLine = target > 0
                ? `<div class="target-line" style="top: ${targetTop}px"><span>havi cel: ${shortFt(monthlyTarget)}</span></div>`
                : "";

            elements.chart.innerHTML = targetLine + monthly.map((amount, index) => {
                const height = Math.max((amount / maxValue) * 100, amount > 0 ? 3 : 0);
                const emptyClass = amount === 0 ? " empty" : "";
                return `
                    <div class="bar-col" title="${MONTHS[index]}: ${formatFt(amount)}">
                        <div class="bar${emptyClass}" style="height: ${height}%">
                            ${amount > 0 ? `<span class="bar-value">${shortFt(amount)}</span>` : ""}
                        </div>
                        <div class="bar-label">${MONTHS[index]}</div>
                    </div>
                `;
            }).join("");
        }

        function shortFt(value) {
            if (value >= 1000000) return `${(value / 1000000).toFixed(1).replace(".", ",")}M`;
            if (value >= 1000) return `${Math.round(value / 1000)}k`;
            return String(Math.round(value));
        }

        function createId() {
            if (window.crypto?.randomUUID) return window.crypto.randomUUID();
            return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function todayLocal() {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            return new Date(today.getTime() - offset).toISOString().slice(0, 10);
        }

        function parseAmount(value) {
            return Number(String(value).replace(/[^\d]/g, "")) || 0;
        }

        function formatAmountInput(input) {
            const amount = parseAmount(input.value);
            input.value = amount ? new Intl.NumberFormat("hu-HU").format(amount) : "";
        }

        function renderInvoices(invoices) {
            elements.emptyState.style.display = invoices.length ? "none" : "block";
            elements.invoiceList.innerHTML = invoices.map((invoice) => `
                <tr class="${invoice.paid ? "paid-row" : ""}">
                    <td>${invoice.date}</td>
                    <td>${escapeHtml(invoice.name || "-")}</td>
                    <td>
                        <button class="paid-toggle ${invoice.paid ? "is-paid" : ""}" type="button" data-paid-id="${invoice.id}">
                            <span class="status-dot"></span>
                            ${invoice.paid ? "Beerkezett" : "Kint van"}
                        </button>
                    </td>
                    <td class="amount">${formatFt(invoice.amount)}</td>
                    <td class="actions"><button class="btn danger" type="button" data-id="${invoice.id}">Torles</button></td>
                </tr>
            `).join("");
        }

        function escapeHtml(value) {
            return value.replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        elements.targetForm.addEventListener("submit", (event) => {
            event.preventDefault();
            state.target = Math.max(0, Number(elements.targetInput.value) || 0);
            saveState();
            render();
        });

        elements.invoiceForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const amount = parseAmount(elements.invoiceAmount.value);
            if (!amount) {
                elements.invoiceAmount.focus();
                return;
            }

            state.invoices.push({
                id: createId(),
                date: elements.invoiceDate.value,
                amount,
                name: elements.invoiceName.value.trim(),
                paid: elements.invoicePaid.checked
            });
            saveState();
            elements.invoiceForm.reset();
            elements.invoiceDate.value = todayLocal();
            render();
        });

        elements.invoiceAmount.addEventListener("blur", () => {
            formatAmountInput(elements.invoiceAmount);
        });

        elements.invoiceList.addEventListener("click", (event) => {
            const paidButton = event.target.closest("button[data-paid-id]");
            if (paidButton) {
                state.invoices = state.invoices.map((invoice) => {
                    if (invoice.id !== paidButton.dataset.paidId) return invoice;
                    return { ...invoice, paid: !invoice.paid };
                });
                saveState();
                render();
                return;
            }

            const button = event.target.closest("button[data-id]");
            if (!button) return;
            state.invoices = state.invoices.filter((invoice) => invoice.id !== button.dataset.id);
            saveState();
            render();
        });

        elements.invoiceDate.value = todayLocal();
        render();
    </script>
</body>
</html>
