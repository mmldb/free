<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Tracker</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #171717;
            --muted: #6b7280;
            --line: #e5e7eb;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --good: #15803d;
            --danger: #b91c1c;
            --shadow: 0 16px 45px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 44px);
            letter-spacing: 0;
            line-height: 1;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
        }

        .year-pill {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 16px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .section {
            padding: 18px;
        }

        .section + .section {
            border-top: 1px solid var(--line);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric {
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .metric span,
        label,
        th {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .metric strong {
            display: block;
            margin-top: 8px;
            font-size: clamp(22px, 3vw, 34px);
            line-height: 1.05;
        }

        .progress-wrap {
            height: 18px;
            overflow: hidden;
            border-radius: 999px;
            background: #edf0f4;
        }

        .progress {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2563eb, #16a34a);
            transition: width 180ms ease;
        }

        .chart {
            height: 260px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding-top: 28px;
            border-bottom: 1px solid var(--line);
        }

        .bar-col {
            min-width: 0;
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: stretch;
            gap: 8px;
        }

        .bar {
            min-height: 3px;
            border-radius: 6px 6px 0 0;
            background: var(--accent);
            position: relative;
        }

        .bar.empty {
            background: #e5e7eb;
        }

        .bar-value {
            position: absolute;
            left: 50%;
            top: -24px;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .bar-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .target-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            background: #fff;
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .btn {
            min-height: 44px;
            border: 0;
            border-radius: 8px;
            padding: 0 16px;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
        }

        .btn.secondary {
            background: #111827;
        }

        .btn.danger {
            min-height: 34px;
            padding: 0 10px;
            background: transparent;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: middle;
        }

        td:last-child,
        th:last-child {
            text-align: right;
        }

        .amount {
            font-weight: 800;
        }

        .empty-state {
            padding: 22px 0 8px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 820px) {
            .app {
                width: min(100% - 20px, 640px);
                padding: 18px 0;
            }

            header,
            .target-row {
                align-items: stretch;
                flex-direction: column;
            }

            .grid,
            .metrics,
            .form-grid,
            .target-row {
                grid-template-columns: 1fr;
            }

            .chart {
                height: 220px;
                gap: 5px;
            }

            .bar-value {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div>
                <h1>Freelance Tracker</h1>
                <p class="subtitle">Számlák, éves cél, haladás. Ennyi.</p>
            </div>
            <div class="year-pill" id="yearLabel"></div>
        </header>

        <section class="metrics" aria-label="Összesítés">
            <div class="metric">
                <span>Bevétel idén</span>
                <strong id="totalIncome">0 Ft</strong>
            </div>
            <div class="metric">
                <span>Éves cél</span>
                <strong id="targetValue">0 Ft</strong>
            </div>
            <div class="metric">
                <span>Haladás</span>
                <strong id="progressValue">0%</strong>
            </div>
        </section>

        <div class="grid">
            <section class="panel">
                <div class="section">
                    <div class="progress-wrap" aria-label="Éves cél haladás">
                        <div class="progress" id="progressBar"></div>
                    </div>
                </div>
                <div class="section">
                    <div class="chart" id="chart" aria-label="Havi bevétel grafikon"></div>
                </div>
            </section>

            <aside class="panel">
                <form class="section target-row" id="targetForm">
                    <div class="field">
                        <label for="targetInput">Éves target</label>
                        <input id="targetInput" type="number" min="0" step="10000" inputmode="numeric">
                    </div>
                    <button class="btn secondary" type="submit">Mentés</button>
                </form>

                <form class="section form-grid" id="invoiceForm">
                    <div class="field">
                        <label for="invoiceDate">Dátum</label>
                        <input id="invoiceDate" type="date" required>
                    </div>
                    <div class="field">
                        <label for="invoiceAmount">Összeg</label>
                        <input id="invoiceAmount" type="number" min="1" step="1000" inputmode="numeric" required>
                    </div>
                    <div class="field full">
                        <label for="invoiceName">Megjegyzés</label>
                        <input id="invoiceName" type="text" placeholder="pl. januári számla">
                    </div>
                    <button class="btn" type="submit">Számla hozzáadása</button>
                </form>
            </aside>
        </div>

        <section class="panel section" style="margin-top: 16px;">
            <table>
                <thead>
                    <tr>
                        <th>Dátum</th>
                        <th>Megjegyzés</th>
                        <th>Összeg</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="invoiceList"></tbody>
            </table>
            <div class="empty-state" id="emptyState">Még nincs felvitt számla.</div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = "freelance_tracker_data";
        const MONTHS = ["Jan", "Feb", "Már", "Ápr", "Máj", "Jún", "Júl", "Aug", "Szep", "Okt", "Nov", "Dec"];
        const currentYear = new Date().getFullYear();
        const defaultState = {
            target: 12000000,
            invoices: []
        };

        let state = loadState();

        const elements = {
            yearLabel: document.getElementById("yearLabel"),
            totalIncome: document.getElementById("totalIncome"),
            targetValue: document.getElementById("targetValue"),
            progressValue: document.getElementById("progressValue"),
            progressBar: document.getElementById("progressBar"),
            chart: document.getElementById("chart"),
            targetForm: document.getElementById("targetForm"),
            targetInput: document.getElementById("targetInput"),
            invoiceForm: document.getElementById("invoiceForm"),
            invoiceDate: document.getElementById("invoiceDate"),
            invoiceAmount: document.getElementById("invoiceAmount"),
            invoiceName: document.getElementById("invoiceName"),
            invoiceList: document.getElementById("invoiceList"),
            emptyState: document.getElementById("emptyState")
        };

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return {
                    ...defaultState,
                    ...saved,
                    invoices: Array.isArray(saved?.invoices) ? saved.invoices : []
                };
            } catch {
                return { ...defaultState };
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function formatFt(value) {
            return new Intl.NumberFormat("hu-HU", {
                style: "currency",
                currency: "HUF",
                maximumFractionDigits: 0
            }).format(value);
        }

        function getYearInvoices() {
            return state.invoices
                .filter((invoice) => new Date(invoice.date).getFullYear() === currentYear)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function render() {
            const invoices = getYearInvoices();
            const total = invoices.reduce((sum, invoice) => sum + invoice.amount, 0);
            const target = Number(state.target) || 0;
            const progress = target > 0 ? Math.min((total / target) * 100, 999) : 0;

            elements.yearLabel.textContent = currentYear;
            elements.totalIncome.textContent = formatFt(total);
            elements.targetValue.textContent = formatFt(target);
            elements.progressValue.textContent = `${Math.round(progress)}%`;
            elements.progressBar.style.width = `${Math.min(progress, 100)}%`;
            elements.targetInput.value = target;

            renderChart(invoices, target);
            renderInvoices(invoices);
        }

        function renderChart(invoices, target) {
            const monthlyTarget = target > 0 ? target / 12 : 0;
            const monthly = Array.from({ length: 12 }, (_, month) => {
                return invoices
                    .filter((invoice) => new Date(invoice.date).getMonth() === month)
                    .reduce((sum, invoice) => sum + invoice.amount, 0);
            });
            const maxValue = Math.max(monthlyTarget, ...monthly, 1);

            elements.chart.innerHTML = monthly.map((amount, index) => {
                const height = Math.max((amount / maxValue) * 100, amount > 0 ? 3 : 0);
                const emptyClass = amount === 0 ? " empty" : "";
                return `
                    <div class="bar-col" title="${MONTHS[index]}: ${formatFt(amount)}">
                        <div class="bar${emptyClass}" style="height: ${height}%">
                            ${amount > 0 ? `<span class="bar-value">${shortFt(amount)}</span>` : ""}
                        </div>
                        <div class="bar-label">${MONTHS[index]}</div>
                    </div>
                `;
            }).join("");
        }

        function shortFt(value) {
            if (value >= 1000000) return `${(value / 1000000).toFixed(1).replace(".", ",")}M`;
            if (value >= 1000) return `${Math.round(value / 1000)}k`;
            return String(value);
        }

        function createId() {
            if (window.crypto?.randomUUID) return window.crypto.randomUUID();
            return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function todayLocal() {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            return new Date(today.getTime() - offset).toISOString().slice(0, 10);
        }

        function renderInvoices(invoices) {
            elements.emptyState.style.display = invoices.length ? "none" : "block";
            elements.invoiceList.innerHTML = invoices.map((invoice) => `
                <tr>
                    <td>${invoice.date}</td>
                    <td>${escapeHtml(invoice.name || "-")}</td>
                    <td class="amount">${formatFt(invoice.amount)}</td>
                    <td><button class="btn danger" type="button" data-id="${invoice.id}">Törlés</button></td>
                </tr>
            `).join("");
        }

        function escapeHtml(value) {
            return value.replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        elements.targetForm.addEventListener("submit", (event) => {
            event.preventDefault();
            state.target = Math.max(0, Number(elements.targetInput.value) || 0);
            saveState();
            render();
        });

        elements.invoiceForm.addEventListener("submit", (event) => {
            event.preventDefault();
            state.invoices.push({
                id: createId(),
                date: elements.invoiceDate.value,
                amount: Math.max(0, Number(elements.invoiceAmount.value) || 0),
                name: elements.invoiceName.value.trim()
            });
            saveState();
            elements.invoiceForm.reset();
            elements.invoiceDate.value = todayLocal();
            render();
        });

        elements.invoiceList.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-id]");
            if (!button) return;
            state.invoices = state.invoices.filter((invoice) => invoice.id !== button.dataset.id);
            saveState();
            render();
        });

        elements.invoiceDate.value = todayLocal();
        render();
    </script>
</body>
</html>
