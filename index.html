<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freelance OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-6 font-sans">
    <div id="login-screen" class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
        <h1 class="text-3xl font-black italic tracking-tighter text-slate-800 mb-2">FREEOS.</h1>
        <p class="text-slate-400 text-sm mb-8 font-medium">Add meg a hozzáférési kódot</p>
        <input type="password" id="pass" class="w-full p-4 rounded-2xl border-2 border-slate-100 text-center text-xl outline-none focus:border-indigo-500 mb-4 transition-all" placeholder="••••">
        <button onclick="check()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold uppercase tracking-widest shadow-lg active:scale-95 transition-all">Belépés</button>
        <p id="err" class="text-red-500 text-xs mt-4 hidden font-bold">Hibás kód!</p>
    </div>

    <div id="main-screen" class="hidden bg-slate-50 min-h-screen w-full fixed inset-0 p-4 overflow-y-auto">
        <div class="max-w-md mx-auto py-6">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black italic tracking-tighter text-indigo-900">FREEOS.</h2>
                <span class="bg-white px-3 py-1 rounded-full text-[10px] font-bold border border-slate-200 uppercase tracking-widest text-slate-400">2026 / Q2</span>
            </div>
            
            <div class="space-y-4 mb-6">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Bruttó (YTD) [cite: 13, 18, 29, 39, 50, 62, 71, 81]</p>
                    <p class="text-3xl font-black text-slate-900">10 176 939 Ft</p>
                </div>
                <div class="bg-indigo-600 p-6 rounded-3xl shadow-xl shadow-indigo-100 text-white">
                    <p class="text-indigo-200 text-[10px] font-bold uppercase mb-1">Nettó EKHO-s</p>
                    <p class="text-3xl font-black tracking-tight">8 140 398 Ft</p>
                    <p class="text-[9px] text-indigo-300 mt-2 font-medium italic italic">Fix adók levonva</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 text-center">Cél: 2M / hó</p>
                <div class="flex items-end justify-between h-32 gap-2">
                    <div class="w-full bg-indigo-100 rounded-t-xl" style="height: 33%"></div>
                    <div class="w-full bg-indigo-200 rounded-t-xl" style="height: 40%"></div>
                    <div class="w-full bg-indigo-500 rounded-t-xl" style="height: 90%"></div>
                    <div class="w-full bg-indigo-600 rounded-t-xl" style="height: 100%"></div>
                </div>
                <div class="flex justify-between mt-2 text-[10px] font-bold text-slate-300 uppercase">
                    <span>Jan</span><span>Feb</span><span>Már</span><span>Ápr</span>
                </div>
            </div>
            
            <button onclick="localStorage.clear(); location.reload();" class="w-full mt-12 py-3 text-slate-300 text-[10px] font-bold uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-2xl">Kilépés</button>
        </div>
    </div>

    <script>
        function check() {
            if(document.getElementById('pass').value === '2026FreeLanceD') {
                localStorage.setItem('auth', '1');
                show();
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        }
        function show() {
            if(localStorage.getItem('auth')) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.body.classList.remove('bg-slate-900');
            }
        }
        show();
    </script>
</body>
</html>
